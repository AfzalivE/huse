# heval settings. Commit this file: it records how your results were made.
# Keep these the same for all profiles that you compare.

# Suite and version. Pin the version, so that the same tasks run each time.
# Find names and versions with: harbor datasets list
DATASET="terminal-bench/terminal-bench@<version>"
N_TASKS=30          # the first N tasks of that version (empty = all tasks)
EXCLUDE_TASKS=()    # task names that fail `heval check` on your machine
ATTEMPTS=3          # runs of each task
CONCURRENCY=2       # low, because subscription plans have usage limits
ENV_TYPE=docker

# One pinned model for each harness.
CLAUDE_MODEL="anthropic/<model-id>"
CODEX_MODEL="openai/<model-id>"
PI_MODEL="openai-codex/<model-id>"

# Pin the harness versions too. Empty = Harbor installs the latest version.
# Use the versions from: claude --version, codex --version, pi --version
CLAUDE_VERSION=""
CODEX_VERSION=""
PI_VERSION=""
